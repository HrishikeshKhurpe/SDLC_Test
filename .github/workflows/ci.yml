name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3 # Updated to v3 for newer actions
    - name: Set up Python
      uses: actions/setup-python@v4 # Updated to v4 for newer actions
      with:
        python-version: '3.10' # Pinned to a specific minor version
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Add any project-specific dependencies here if needed
    - name: Run tests
      run: |
        python -m unittest discover calculator/tests
